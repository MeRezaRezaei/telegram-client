name: run-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # No services by design: tests run on sqlite :memory: and the Redis
    # suites fake the connection contract (live Redis is never required
    # in CI); the 5 live-credential tests self-skip without
    # TELEGRAM_CLIENT_LIVE=1.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        stability: [prefer-stable]

    name: P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dev-mode sibling for the composer path repository (../teleproto,
      # (legacy note: teleproto resolves from Packagist ^1.1)
      # drop this step when the constraint flips to ^1.0 for publishing
      # (see CHANGELOG "Release blockers").
      - name: Clone teleproto sibling for the dev path-repo
        run: git clone --depth 1 https://github.com/MeRezaRezaei/teleproto.git ../teleproto

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, openssl, hash, json, pdo, pdo_sqlite, sqlite3, sodium, pcntl, posix
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.stability }}

      - name: Execute tests
        run: vendor/bin/phpunit

  # Night W3: PostgreSQL track — the sqlite matrix cannot see native uuid
  # columns, DEFERRABLE INITIALLY DEFERRED cross-type FKs, or the FULL
  # 637-migration generated set (sqlite tests only run the 112-file dial +
  # entity anchors). Env TELEGRAM_CLIENT_PG=1 forces the track on; the
  # sqlite matrix jobs keep default-skipping it (no PG service there).
  pg-tests:
    runs-on: ubuntu-latest
    name: PG 17 - full mirror

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teleproto_night_test
          POSTGRES_USER: me
          POSTGRES_PASSWORD: telegram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U me -d teleproto_night_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TELEGRAM_CLIENT_PG: 1
      TELEGRAM_CLIENT_PG_HOST: 127.0.0.1
      TELEGRAM_CLIENT_PG_PORT: 5432
      TELEGRAM_CLIENT_PG_DATABASE: teleproto_night_test
      TELEGRAM_CLIENT_PG_USER: me
      TELEGRAM_CLIENT_PG_PASSWORD: telegram

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dev-mode sibling for the composer path repository (../teleproto);
      # mirrors the sqlite matrix jobs.
      - name: Clone teleproto sibling for the dev path-repo
        run: git clone --depth 1 https://github.com/MeRezaRezaei/teleproto.git ../teleproto

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, openssl, hash, json, pdo, pdo_sqlite, sqlite3, pdo_pgsql, sodium, pcntl, posix
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Execute Postgres track
        run: vendor/bin/phpunit tests/Pg
